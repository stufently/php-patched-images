name: build

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "17 3 * * 1" # weekly rebuild: OS security updates
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# One reusable-workflow call per image family (see images.yml): each family
# has its own build -> manifest chain, so a red family does not hold back the
# publication of the others.
jobs:
  trixie:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/images.yml
    with:
      targets: >-
        [
        {"branch":"8.5","os":"trixie","variant":"cli"},{"branch":"8.5","os":"trixie","variant":"fpm"},{"branch":"8.5","os":"trixie","variant":"apache"},
        {"branch":"8.4","os":"trixie","variant":"cli"},{"branch":"8.4","os":"trixie","variant":"fpm"},{"branch":"8.4","os":"trixie","variant":"apache"},
        {"branch":"8.3","os":"trixie","variant":"cli"},{"branch":"8.3","os":"trixie","variant":"fpm"},{"branch":"8.3","os":"trixie","variant":"apache"},
        {"branch":"8.2","os":"trixie","variant":"cli"},{"branch":"8.2","os":"trixie","variant":"fpm"},{"branch":"8.2","os":"trixie","variant":"apache"}
        ]

  bookworm:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/images.yml
    with:
      targets: >-
        [
        {"branch":"8.5","os":"bookworm","variant":"cli"},{"branch":"8.5","os":"bookworm","variant":"fpm"},{"branch":"8.5","os":"bookworm","variant":"apache"},
        {"branch":"8.4","os":"bookworm","variant":"cli"},{"branch":"8.4","os":"bookworm","variant":"fpm"},{"branch":"8.4","os":"bookworm","variant":"apache"},
        {"branch":"8.3","os":"bookworm","variant":"cli"},{"branch":"8.3","os":"bookworm","variant":"fpm"},{"branch":"8.3","os":"bookworm","variant":"apache"},
        {"branch":"8.2","os":"bookworm","variant":"cli"},{"branch":"8.2","os":"bookworm","variant":"fpm"},{"branch":"8.2","os":"bookworm","variant":"apache"}
        ]

  alpine:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/images.yml
    with:
      targets: >-
        [
        {"branch":"8.5","os":"alpine","variant":"cli"},{"branch":"8.5","os":"alpine","variant":"fpm"},
        {"branch":"8.4","os":"alpine","variant":"cli"},{"branch":"8.4","os":"alpine","variant":"fpm"},
        {"branch":"8.3","os":"alpine","variant":"cli"},{"branch":"8.3","os":"alpine","variant":"fpm"},
        {"branch":"8.2","os":"alpine","variant":"cli"},{"branch":"8.2","os":"alpine","variant":"fpm"}
        ]

  backport:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/images.yml
    with:
      targets: >-
        [
        {"branch":"8.1-backport","os":"bookworm","variant":"cli"},{"branch":"8.1-backport","os":"bookworm","variant":"fpm"},{"branch":"8.1-backport","os":"bookworm","variant":"apache"},
        {"branch":"7.4-backport","os":"bookworm","variant":"cli"},{"branch":"7.4-backport","os":"bookworm","variant":"fpm"},{"branch":"7.4-backport","os":"bookworm","variant":"apache"}
        ]
