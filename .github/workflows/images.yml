name: images

# Reusable: build, smoke-test and (on master) publish one family of images.
# Called from build.yml once per family, so a failure in one family does not
# block the manifests of the others.

on:
  workflow_call:
    inputs:
      targets:
        description: 'JSON list of {"branch","os","variant"} objects'
        required: true
        type: string

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}
  PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}

jobs:
  build:
    name: ${{ matrix.t.branch }}-${{ matrix.t.os }}-${{ matrix.t.variant }} (${{ matrix.platform.arch }})
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        t: ${{ fromJSON(inputs.targets) }}
        platform:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build core + profiles
        env:
          BRANCH: ${{ matrix.t.branch }}
          OS: ${{ matrix.t.os }}
          VARIANT: ${{ matrix.t.variant }}
        run: |
          BUILT_LIST="$RUNNER_TEMP/built.txt" scripts/build.sh "$BRANCH" "$OS" "$VARIANT" local/php-patched
          cat "$RUNNER_TEMP/built.txt"

      - name: Smoke tests
        run: |
          while read -r image variant profile commit _; do
            tests/smoke.sh "$image" "$variant" "$profile" "$commit"
          done < "$RUNNER_TEMP/built.txt"

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push per-arch images, record digests
        if: env.PUBLISH == 'true'
        env:
          ARCH: ${{ matrix.platform.arch }}
          KEY: ${{ matrix.t.branch }}-${{ matrix.t.os }}-${{ matrix.t.variant }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          out="$RUNNER_TEMP/digests/$KEY-$ARCH.txt"
          : > "$out"
          while read -r image _ _ _ tags; do
            primary=${tags%% *}
            remote="$IMAGE:$primary-$ARCH"
            docker tag "$image" "$remote"
            docker push "$remote"
            digest=$(docker inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$remote" | grep "^$IMAGE@sha256:" | head -1)
            [ -n "$digest" ] || { echo "no digest for $remote"; exit 1; }
            echo "$digest $tags" >> "$out"
          done < "$RUNNER_TEMP/built.txt"
          cat "$out"

      - name: Upload digests
        if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.t.branch }}-${{ matrix.t.os }}-${{ matrix.t.variant }}-${{ matrix.platform.arch }}
          path: ${{ runner.temp }}/digests/
          retention-days: 3

  manifest:
    name: manifest ${{ matrix.t.branch }}-${{ matrix.t.os }}-${{ matrix.t.variant }}
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        t: ${{ fromJSON(inputs.targets) }}
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digests-${{ matrix.t.branch }}-${{ matrix.t.os }}-${{ matrix.t.variant }}-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      # Manifests reference the digests pushed by THIS run, never the mutable
      # per-arch tags, so a concurrent or re-run job cannot mix images.
      # Line format: <digest> <primary tag> <pinned tag> [<alias tags>...]
      - name: Create multi-arch manifests
        env:
          KEY: ${{ matrix.t.branch }}-${{ matrix.t.os }}-${{ matrix.t.variant }}
        run: |
          d="$RUNNER_TEMP/digests"
          amd_f="$d/$KEY-amd64.txt" arm_f="$d/$KEY-arm64.txt"
          [ -s "$amd_f" ] && [ -s "$arm_f" ] || { echo "missing digest files for $KEY"; exit 1; }
          [ "$(cut -d' ' -f2- "$amd_f" | sort)" = "$(cut -d' ' -f2- "$arm_f" | sort)" ] || { echo "amd64/arm64 image sets differ"; exit 1; }
          stamp=$(date -u +%Y%m%d)
          while read -r amd primary pinned aliases; do
            arm=$(awk -v k="$primary" '$2==k{print $1}' "$arm_f")
            [ -n "$amd" ] && [ -n "$arm" ] || { echo "missing digest for $primary"; exit 1; }
            tags=(-t "$IMAGE:$primary" -t "$IMAGE:$pinned")
            for a in $aliases; do tags+=(-t "$IMAGE:$a"); done
            # dated snapshot tags are immutable: never overwrite an existing one
            if ! docker buildx imagetools inspect "$IMAGE:$pinned-$stamp" >/dev/null 2>&1; then
              tags+=(-t "$IMAGE:$pinned-$stamp")
            fi
            docker buildx imagetools create "${tags[@]}" "$amd" "$arm"
            docker buildx imagetools inspect "$IMAGE:$pinned"
          done < "$amd_f"
