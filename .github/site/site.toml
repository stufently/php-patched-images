[[faq]]
q = "Which PHP versions fix CVE-2026-109618 and CVE-2026-109619?"
a = "PHP 8.5.12, 8.4.27, 8.3.36 and 8.2.35, released on 2026-10-21. A build is safe if php -v reports at least the fixed version for its branch; check the build that serves the web (phpinfo() or php-fpm -v), not only the CLI."

[[faq]]
q = "How do I switch from the official php image?"
a = "Replace FROM php:8.x-<variant>[-bookworm|-alpine] with FROM ghcr.io/stufently/php-patched-images:8.x-<variant>[-bookworm|-alpine], rebuild and restart all workers. The layout matches the official image: /usr/local/etc/php, docker-php-ext-* and the entrypoint."

[[faq]]
q = "Why are the images not built FROM php:*?"
a = "Official php:* images with the fixed versions were not yet on Docker Hub at release time. The images are built from source with the docker-library/php Dockerfiles at the commit that bumped to the fixed versions, with the base image pinned by digest."

[[faq]]
q = "Are the PHP 7.4 and 8.1 backport images an official PHP release?"
a = "No. PHP 7.4 and 8.1 are end-of-life; the PHP security team only published minimal fixes on php-src branches, without a tarball, release signature or release test cycle. The 7.4-backport-* and 8.1-backport-* images build those branches pinned to a commit; treat them as a stopgap until you move to 8.2+."

[[faq]]
q = "How do I tell a fixed 8.1 backport build from a vulnerable one?"
a = "Not by the version string: the 8.1 branch reports 8.1.34, the same as the last vulnerable official release. Check the commit: phpinfo() Configure Command contains PHP_BACKPORT_COMMIT=<sha>, and the image label org.opencontainers.image.revision.php-src holds it too."

[[faq]]
q = "What about CVE-2026-115560 and session upload progress?"
a = "Informational advisory 2026-10-23-1 recommends session.upload_progress.enabled=0 until the next bugfix release. These images already set it to 0 by default in the zz-patched-images.ini overlay; override it in your own conf.d if you need native session upload progress."
